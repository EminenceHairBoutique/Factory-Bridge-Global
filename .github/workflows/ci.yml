name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR commits; required once the repo is private

jobs:
  check:
    name: typecheck · lint · format · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting runs BEFORE any step that writes files into the checkout (gitleaks emits results.sarif);
      # *.sarif is also in .prettierignore and .gitignore so the two tools cannot interact either way.
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Production build gate (M0-D): `next build` must succeed, and the built app served by `next start` must
      # answer 404 (with no prototype screen content) on /design-preview in every production configuration; a
      # positive control proves the 404s come from the gate. APP_ENV / DESIGN_PREVIEW are deliberately unset here.
      # Writes apps/web/.next only (ignored by prettier, eslint and git), after format:check has already run.
      - name: Production build + design-preview isolation (next build, next start smoke test)
        run: pnpm verify:production-build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Dependency audit (prod, high+)
        run: pnpm audit --prod --audit-level high

  db:
    name: "db: migrations on real Postgres (local Supabase stack) + RLS coverage guard"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pinned (M0-C): generated DB types must be reproducible, so the CLI (and the postgres-meta generator it runs,
      # v0.100.0 for CLI 3.1.0) only changes in a reviewed PR — bump it together with packages/db/src/types.ts.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ClamAV for the document pipeline (B-13). Started first so it loads its signature database while the Supabase
      # stack boots; bound to loopback only. Free and local: no account, no API key, nothing uploaded anywhere.
      - name: Start ClamAV (clamd)
        run: docker run -d --name clamav -p 127.0.0.1:3310:3310 clamav/clamav:stable

      # Real PostgreSQL + Supabase auth schema/roles + storage-api (its migrations create the storage.buckets columns
      # and storage.objects shape that migration 0006's bucket rows and policies depend on). Other heavy services are excluded.
      - name: Start local Supabase stack
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      # Proves the migration chain applies from zero, then seed; run twice to prove seed idempotency.
      - name: Apply migrations from scratch (twice)
        run: |
          supabase db reset
          supabase db reset

      # The suite VERIFIES the CLI-applied schema (enum drift, privileges, RLS coverage guard) and, from
      # B-07, runs the tenant-isolation suite as `authenticated` sessions. It fails if no tests execute.
      - name: "Database test suite (engine: postgres)"
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Generated types (M0-C): packages/db/src/types.ts is never hand-written. It must equal what the pinned CLI
      # generates from this exact migration chain (formatted with the repo's Prettier config); on drift the job fails,
      # prints a bounded diff and attaches the regenerated file as an artifact. Locally: supabase db reset && pnpm db:gen-types
      - name: Generated database types match the migrations (drift check)
        id: db_types
        run: node scripts/gen-db-types.mjs --check

      - name: Attach regenerated types on drift
        if: failure() && steps.db_types.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-db-types
          path: ${{ runner.temp }}/types.ts
          retention-days: 7

      # The worker integration suite reaches Storage over HTTP like the worker does. The URL and service-role key are
      # this throwaway local stack's own (printed by the CLI), never a hosted project's; masked in the log regardless.
      - name: Export the local stack's API URL and service-role key
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Wait for ClamAV to accept scans
        run: |
          for i in $(seq 1 90); do
            status="$(docker inspect --format '{{.State.Health.Status}}' clamav 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then docker exec clamav clamd --version; exit 0; fi
            sleep 4
          done
          echo "ClamAV did not become healthy (last status: $status)"; docker logs --tail 40 clamav; exit 1

      # B-13: the scanner adapter against a REAL engine — the EICAR test file must be detected, clean samples must
      # pass, a 25 MB file must scan. Fails (never skips) without a daemon, so green means a real scan happened.
      - name: "Malware scanner (real ClamAV: EICAR detected, clean files pass)"
        run: pnpm --filter @fbg/worker test:clamav
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"

      # Worker × real pgmq (B-11) and × the document pipeline (B-12 / B-13): the consumer's claim / retry / backoff /
      # dead-letter / take-over SQL against this stack's queues and the 0012b grants, connecting as the worker does
      # (set local role service_role); then fbg_documents end to end — real Postgres, real Storage, real ClamAV, the
      # real sandboxed parser — including EICAR rejection, cross-tenant refusal and the RLS checks as signed-in users.
      # Its own vitest config (apps/worker/vitest.integration.config.ts): it fails, never skips, without a database.
      - name: "Worker integration (real pgmq, Storage and ClamAV; as service_role)"
        run: pnpm --filter @fbg/worker test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"

      - name: Stop stack
        if: always()
        run: |
          docker rm -f clamav || true
          supabase stop --no-backup
